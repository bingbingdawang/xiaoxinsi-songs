
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Room | Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #121212;
      color: #ffffff;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .app {
      width: min(760px, 92%);
      margin: 0 auto;
      padding: 35px 0 150px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 45px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #1ed760;
      color: #121212;
      font-size: 23px;
      font-weight: bold;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 5px;
      color: #a7a7a7;
      font-size: 12px;
    }

    .section-title {
      margin-bottom: 24px;
      font-size: 30px;
      font-weight: 700;
    }

    .player-card {
      padding: 28px;
      border-radius: 14px;
      background: #202020;
    }

    .cover {
      display: grid;
      place-items: center;
      width: 100%;
      max-width: 330px;
      aspect-ratio: 1;
      margin: 0 auto 28px;
      border-radius: 10px;
      background: linear-gradient(145deg, #234e38, #111b15 70%);
      color: #1ed760;
      font-size: 100px;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-name {
      overflow-wrap: anywhere;
      margin: 0 0 8px;
      font-size: 23px;
      font-weight: bold;
    }

    .artist {
      overflow-wrap: anywhere;
      color: #b3b3b3;
      font-size: 14px;
    }

    .progress-area {
      margin-top: 28px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      color: #b3b3b3;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #1ed760;
      cursor: pointer;
    }

    #progress {
      display: block;
      margin: 10px 0;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin: 24px 0;
    }

    button {
      cursor: pointer;
      border: none;
    }

    .play-button {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #1ed760;
      color: #121212;
      font-size: 25px;
      transition: transform 0.15s;
    }

    .play-button:hover {
      transform: scale(1.06);
    }

    .secondary-button {
      background: transparent;
      color: white;
      font-size: 24px;
    }

    .hint {
      margin-top: 25px;
      padding: 18px;
      border: 1px solid #363636;
      border-radius: 10px;
      color: #b3b3b3;
      font-size: 13px;
      line-height: 1.8;
    }

    .upload-button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 24px;
      background: white;
      color: #121212;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .upload-button:hover {
      background: #e5e5e5;
    }

    #fileInput {
      display: none;
    }

    .file-name {
      margin-top: 12px;
      overflow-wrap: anywhere;
      color: #1ed760;
      font-size: 12px;
    }

    footer {
      margin-top: 30px;
      color: #777777;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 500px) {
      .app {
        padding-top: 24px;
      }

      header {
        margin-bottom: 32px;
      }

      .section-title {
        font-size: 25px;
      }

      .player-card {
        padding: 20px 16px;
      }

      .cover {
        max-width: 260px;
      }

      .song-name {
        font-size: 20px;
      }
    }
    .library {
  margin-top: 38px;
}

#libraryStatus {
  margin-bottom: 14px;
  color: #a7a7a7;
  font-size: 13px;
  line-height: 1.8;
}

#songList {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.song-item {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 15px;
  border-radius: 9px;
  background: #202020;
  color: white;
  text-align: left;
  transition: background 0.2s;
}

.song-item:hover {
  background: #303030;
}

.song-item.active {
  background: #263b2d;
}

.song-item-icon {
  color: #1ed760;
  font-size: 22px;
}

.song-item-info {
  min-width: 0;
  flex: 1;
}

.song-item-name {
  overflow-wrap: anywhere;
  font-size: 14px;
  font-weight: bold;
}

.song-item-subtitle {
  margin-top: 5px;
  color: #a7a7a7;
  font-size: 12px;
}
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="logo">♫</div>
      <div>
        <div class="brand">Green Room</div>
        <div class="subtitle">YOUR PERSONAL MUSIC SPACE</div>
      </div>
    </header>

    <main>
      <div class="section-title">现在播放</div>

      <section class="player-card">
        <div class="cover" id="cover">♫</div>

        <div class="song-name" id="songName">还没有选择歌曲</div>
        <div class="artist" id="artist">选择一首音乐，开始聆听</div>

        <div class="progress-area">
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>

          <input
            id="progress"
            type="range"
            min="0"
            max="1000"
            value="0"
            aria-label="歌曲播放进度"
          >
        </div>

        <div class="controls">
          <button class="secondary-button" id="restart"
            aria-label="从头播放">↺</button>

          <button class="play-button" id="playButton"
            aria-label="播放音乐">▶</button>

          <button class="secondary-button" id="muteButton"
            aria-label="静音">♫</button>
        </div>

        <div class="progress-area">
          <div class="time-row">
            <span>音量</span>
            <span id="volumeLabel">80%</span>
          </div>
          <input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="80"
            aria-label="音量"
          >
        </div>

        <div class="hint">
          这是你的私人音乐空间。选择电脑中的音频文件，
          就可以开始播放。

          <br>

          <label class="upload-button" for="fileInput">
            ＋ 选择音乐文件
          </label>

          <input
            id="fileInput"
            type="file"
            accept="audio/*"
            multiple
          >

          <div class="file-name" id="fileName">
            支持浏览器能够播放的常见音频格式
          </div>
        </div>
      </section>

      </section class="library">
        <h2 class="section-title">我的音乐</h2>
        <div id="libraryStatus">正在加载歌曲列表......</div>
        <div id="songList"></div>
        </section>
    </main>

    <footer>
      Made for music, made for you.
    </footer>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script>
    const audio = document.querySelector("#audio");
    const fileInput = document.querySelector("#fileInput");
    const playButton = document.querySelector("#playButton");
    const restartButton = document.querySelector("#restart");
    const muteButton = document.querySelector("#muteButton");
    const progress = document.querySelector("#progress");
    const volume = document.querySelector("#volume");

    const songName = document.querySelector("#songName");
    const artist = document.querySelector("#artist");
    const currentTime = document.querySelector("#currentTime");
    const duration = document.querySelector("#duration");
    const volumeLabel = document.querySelector("#volumeLabel");
    const fileName = document.querySelector("#fileName");
    const cover = document.querySelector("#cover");

    let currentFileUrl = null;
    let isSeeking = false;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) {
        return "0:00";
      }

      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);

      return minutes + ":" +
        String(remainingSeconds).padStart(2, "0");
    }

    fileInput.addEventListener("change", function () {
      const file = fileInput.files[0];

      if (!file) return;

      if (currentFileUrl) {
        URL.revokeObjectURL(currentFileUrl);
      }

      currentFileUrl = URL.createObjectURL(file);
      audio.src = currentFileUrl;
      audio.load();

      songName.textContent = file.name.replace(/\.[^.]+$/, "");
      artist.textContent = "本地音乐";
      fileName.textContent = "已选择：" + file.name;

      cover.textContent = "♫";
      cover.querySelector("img")?.remove();

      progress.value = 0;
      currentTime.textContent = "0:00";
      duration.textContent = "读取时长中…";

      audio.play().then(function () {
        playButton.textContent = "Ⅱ";
      }).catch(function () {
        playButton.textContent = "▶";
        fileName.textContent =
          "歌曲已选择，请点击播放按钮开始播放。";
      });
    });

    playButton.addEventListener("click", function () {
      if (!audio.src) {
        fileInput.click();
        return;
      }

      if (audio.paused) {
        audio.play().catch(function () {
          fileName.textContent = "无法播放此文件，请尝试其他音频格式。";
        });
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", function () {
      playButton.textContent = "Ⅱ";
    });

    audio.addEventListener("pause", function () {
      playButton.textContent = "▶";
    });

    audio.addEventListener("loadedmetadata", function () {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", function () {
      currentTime.textContent = formatTime(audio.currentTime);

      if (!isSeeking && Number.isFinite(audio.duration) &&
          audio.duration > 0) {
        progress.value =
          audio.currentTime / audio.duration * 1000;
      }
    });

    progress.addEventListener("input", function () {
      isSeeking = true;

      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        currentTime.textContent = formatTime(
          Number(progress.value) / 1000 * audio.duration
        );
      }
    });

    progress.addEventListener("change", function () {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime =
          Number(progress.value) / 1000 * audio.duration;
      }

      isSeeking = false;
    });

    restartButton.addEventListener("click", function () {
      if (!audio.src) {
        fileInput.click();
        return;
      }

      audio.currentTime = 0;
      audio.play().catch(function () {});
    });

    volume.addEventListener("input", function () {
      audio.volume = Number(volume.value) / 100;
      volumeLabel.textContent = volume.value + "%";
      muteButton.textContent = audio.volume === 0 ? "×" : "♫";
    });

    muteButton.addEventListener("click", function () {
      audio.muted = !audio.muted;
      muteButton.textContent = audio.muted ? "×" : "♫";
    });

    audio.volume = 0.8;
        // ===== Supabase 音乐库配置 =====
    const SUPABASE_URL = "https://dsrripfsqiknlnuzcztp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_AOmcwPjdmmHmTi0shHvtGA_O6tl0dHu";
    const BUCKET_NAME = "xiaoxinsiaudio";

    const libraryStatus = document.querySelector("#libraryStatus");
    const songList = document.querySelector("#songList");

    let supabaseSongs = [];
    let activeSongName = "";

    // 获取公开音频文件的 URL
    function getSongUrl(filePath) {
      const encodedPath = filePath
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

      return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${encodedPath}`;
    }

    // 从文件名中去掉扩展名
    function getSongTitle(fileName) {
      return fileName.split("/").pop().replace(/\.[^.]+$/, "");
    }

    // 获取并显示歌曲列表
    async function loadSupabaseSongs() {
      libraryStatus.textContent = "正在连接音乐库……";
      songList.replaceChildren();

      try {
        const response = await fetch(
          `${SUPABASE_URL}/storage/v1/object/list/${BUCKET_NAME}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },
            body: JSON.stringify({
              prefix: "",
              limit: 100,
              offset: 0,
              sortBy: {
                column: "name",
                order: "asc"
              }
            })
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const files = await response.json();

        const audioFiles = files.filter(file => {
          if (!file.name || file.id == null) return false;

          return /\.(mp3|m4a|aac|wav|ogg|oga|flac|opus|webm)$/i
            .test(file.name);
        });

        supabaseSongs = audioFiles.map(file => ({
          name: file.name,
          title: getSongTitle(file.name),
          url: getSongUrl(file.name)
        }));

        if (supabaseSongs.length === 0) {
          libraryStatus.textContent =
            "暂时没有找到音频文件，请检查存储桶中的文件。";
          return;
        }

        libraryStatus.textContent =
          `共 ${supabaseSongs.length} 首歌曲`;

        supabaseSongs.forEach(song => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "song-item";

          const icon = document.createElement("span");
          icon.className = "song-item-icon";
          icon.textContent = "♫";

          const info = document.createElement("div");
          info.className = "song-item-info";

          const title = document.createElement("div");
          title.className = "song-item-name";
          title.textContent = song.title;

          const subtitle = document.createElement("div");
          subtitle.className = "song-item-subtitle";
          subtitle.textContent = "Green Room · 在线音乐";

          info.append(title, subtitle);
          button.append(icon, info);

          button.addEventListener("click", () => {
            playSupabaseSong(song);
          });

          songList.appendChild(button);
        });
      } catch (error) {
        console.error("音乐库加载失败：", error);
        libraryStatus.textContent =
          "歌曲列表加载失败，请检查项目配置和网络连接。";
      }
    }

    // 播放 Supabase 中的歌曲
    function playSupabaseSong(song) {
      activeSongName = song.name;

      if (currentFileUrl) {
        URL.revokeObjectURL(currentFileUrl);
        currentFileUrl = null;
      }

      audio.src = song.url;
      audio.load();

      songName.textContent = song.title;
      artist.textContent = "小心思";
      fileName.textContent = "正在播放在线音乐：" + song.title;

      cover.textContent = "♫";
      cover.querySelector("img")?.remove();

      progress.value = 0;
      currentTime.textContent = "0:00";
      duration.textContent = "读取时长中…";

      document.querySelectorAll(".song-item").forEach(button => {
        button.classList.remove("active");

        if (button.querySelector(".song-item-name")?.textContent
            === song.title) {
          button.classList.add("active");
        }
      });

      audio.play().catch(error => {
        console.error("播放失败：", error);
        fileName.textContent =
          "播放失败，请检查音频 URL 和存储桶权限。";
      });
    }

    // 页面打开时自动加载音乐库
    loadSupabaseSongs();

    audio.addEventListener("error", function () {
      if (audio.src) {
        fileName.textContent =
          "文件无法播放，请尝试选择浏览器支持的音频文件。";
      }
    });
  </script>
</body>
</html>
