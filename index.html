    .player-card {

    }

    .cover {

      place-items: center;
      width: 100%;
      max-width: 330px;
      aspect-ratio: 1;
      margin: 0 auto 28px;
      border-radius: 10px;
      background: linear-gradient(145deg, #234e38, #111b15 70%);
      color: #1ed760;
      font-size: 100px;
      overflow: hidden;
    }

    .cover img {

      height: 100%;

    }

    .song-name {

      margin: 0 0 8px;
      font-size: 23px;
      font-weight: bold;
    }

    .artist {

      color: #b3b3b3;

    }

    .progress-area {

    }

      color: #b3b3b3;
      font-size: 12px;
    }

    input[type="range"] {

      accent-color: #1ed760;
      cursor: pointer;
    }

    #progress {

      margin: 10px 0;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin: 24px 0;
    }

      cursor: pointer;
      border: none;
    }

      color: #121212;

      color: white;
      font-size: 24px;

      color: #b3b3b3;
      font-size: 13px;

let shuffleHistory = [];          // 已播放历史，保存歌曲文件名
let shuffleHistoryPosition = -1;  // 当前在历史记录中的位置
let shuffleUpcoming = [];         // 本轮还没播放的随机歌曲

// Fisher-Yates 洗牌算法
function shuffleArray(items) {
  const result = [...items];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

// 生成一轮随机队列
function refillShuffleUpcoming(excludeSongName = "") {
  const candidates = supabaseSongs.filter(
    song => song.name !== excludeSongName
  );

  shuffleUpcoming = shuffleArray(candidates);
}

// 重置随机队列，以当前歌曲为起点
function resetShuffleQueue(startSongName = "") {
  shuffleHistory = [];
  shuffleHistoryPosition = -1;
  shuffleUpcoming = [];

  if (startSongName) {
    shuffleHistory.push(startSongName);
    shuffleHistoryPosition = 0;
  }

  refillShuffleUpcoming(startSongName);
}

  shuffleHistory = [song.name];
  shuffleHistoryPosition = 0;

    //获取日期函数
    function getSongDate(fileName) {
      const name = fileName.split("/").pop();
      return songDateMap[name.toLowerCase()] || null;
    }

    // 根据文件名显示中文歌名
    function getSongTitle(fileName) {
      const name = fileName.split("/").pop();
      const title = songTitleMap[name.toLowerCase()];

      // 有映射就显示中文，没有映射就显示原文件名
      return title || name.replace(/\.[^.]+$/, "");
    }


    // 按日期分组显示歌曲；没有日期的歌曲归入“未分类”
    function getArchiveGroup(song) {
      if (!song.date) return "未分类";

      const match = song.date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return "未分类";

      return `${match[1]} 年 · ${Number(match[2])} 月`;
    }

    // 只改变列表显示，不改变 supabaseSongs 的播放顺序
    function renderSongListPage() {
      const totalPages = Math.max(1, Math.ceil(displaySongs.length / PAGE_SIZE));
      currentPage = Math.min(Math.max(currentPage, 1), totalPages);

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageSongs = displaySongs.slice(start, start + PAGE_SIZE);
      songList.replaceChildren();

      let currentGroup = "";
      let groupSongsContainer = null;

      pageSongs.forEach((song, indexOnPage) => {
        const group = getArchiveGroup(song);

        if (group !== currentGroup) {
          const groupSection = document.createElement("section");
          groupSection.className = "archive-group";

          const groupHeading = document.createElement("button");
          groupHeading.type = "button";
          groupHeading.className = "archive-group-title";
          const groupId = `archive-${currentPage}-${indexOnPage}`;
          groupHeading.setAttribute("aria-controls", groupId);
          groupHeading.setAttribute("aria-expanded", String(!collapsedArchiveGroups.has(group)));

          const headingText = document.createElement("span");
          headingText.textContent = group;

          const arrow = document.createElement("span");
          arrow.className = "archive-group-arrow";
          arrow.textContent = "⌄";
          arrow.setAttribute("aria-hidden", "true");

          groupHeading.append(headingText, arrow);
          groupHeading.addEventListener("click", () => {
            if (collapsedArchiveGroups.has(group)) {
              collapsedArchiveGroups.delete(group);
            } else {
              collapsedArchiveGroups.add(group);
            }
            renderSongListPage();
          });

          groupSongsContainer = document.createElement("div");
          groupSongsContainer.className = "archive-group-songs";
          groupSongsContainer.id = groupId;
          groupSongsContainer.hidden = collapsedArchiveGroups.has(group);

          groupSection.append(groupHeading, groupSongsContainer);
          songList.appendChild(groupSection);
          currentGroup = group;
        }

        const button = document.createElement("button");
        button.type = "button";
        button.className = "song-item";
        button.dataset.songName = song.name;

        if (song.name === activeSongName) button.classList.add("active");

        const icon = document.createElement("span");
        icon.className = "song-item-icon";
        icon.textContent = "♫";

        const info = document.createElement("div");
        info.className = "song-item-info";

        const title = document.createElement("div");
        title.className = "song-item-name";
        title.textContent = song.title;

        const subtitle = document.createElement("div");
        subtitle.className = "song-item-subtitle";
        subtitle.textContent = song.date
          ? `${song.date} · Green Room 在线音乐`
          : "日期未设置 · Green Room 在线音乐";

        info.append(title, subtitle);
        button.append(icon, info);
        button.addEventListener("click", () => playSupabaseSong(song));
        groupSongsContainer.appendChild(button);
      });

      const activeDisplayIndex = displaySongs.findIndex(song => song.name === activeSongName);
      playingTrackLocator.hidden = activeDisplayIndex < 0;
      if (activeDisplayIndex >= 0) {
        playingTrackLocator.textContent = `定位正在播放：${displaySongs[activeDisplayIndex].title}`;
      }

      pagination.replaceChildren();
      if (totalPages <= 1) {
        pagination.hidden = true;
      } else {
        pagination.hidden = false;

        const previousButton = document.createElement("button");
        previousButton.type = "button";
        previousButton.className = "pagination-button";
        previousButton.textContent = "上一页";
        previousButton.disabled = currentPage === 1;
        previousButton.addEventListener("click", () => {
          if (currentPage > 1) {
            currentPage -= 1;
            renderSongListPage();
          }
        });

        const pageInfo = document.createElement("span");
        pageInfo.className = "pagination-info";
        pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;

        const nextButton = document.createElement("button");
        nextButton.type = "button";
        nextButton.className = "pagination-button";
        nextButton.textContent = "下一页";
        nextButton.disabled = currentPage === totalPages;
        nextButton.addEventListener("click", () => {
          if (currentPage < totalPages) {
            currentPage += 1;
            renderSongListPage();
          }
        });

        pagination.append(previousButton, pageInfo, nextButton);
      }
    }

    playingTrackLocator.addEventListener("click", () => {
      const activeDisplayIndex = displaySongs.findIndex(song => song.name === activeSongName);
      if (activeDisplayIndex < 0) return;

      currentPage = Math.floor(activeDisplayIndex / PAGE_SIZE) + 1;
      const activeSong = displaySongs[activeDisplayIndex];
      collapsedArchiveGroups.delete(getArchiveGroup(activeSong));
      renderSongListPage();

      requestAnimationFrame(() => {
        const activeButton = Array.from(songList.querySelectorAll(".song-item"))
          .find(button => button.dataset.songName === activeSongName);
        if (activeButton) {
          activeButton.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      });
    });

    // 获取并显示歌曲列表
    async function loadSupabaseSongs() {
      libraryStatus.textContent = "正在连接音乐库……";
      songList.replaceChildren();

      try {
        const response = await fetch(
          `${SUPABASE_URL}/storage/v1/object/list/${BUCKET_NAME}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },
            body: JSON.stringify({
              prefix: "",
              limit: 100,
              offset: 0,
              sortBy: {
                column: "name",
                order: "asc"
              }
            })
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const files = await response.json();

        const audioFiles = files.filter(file => {
          if (!file.name || file.id == null) return false;

          return /\.(mp3|m4a|aac|wav|ogg|oga|flac|opus|webm)$/i
            .test(file.name);
        });

        supabaseSongs = audioFiles.map(file => ({
            name: file.name,
            title: getSongTitle(file.name),
            url: getSongUrl(file.name),
            date:getSongDate(file.name)
          }))
          .sort((a, b) =>
            a.title.localeCompare(b.title, "zh-CN", {
              numeric: true,
              sensitivity: "base"
            })
          );

        

        if (supabaseSongs.length === 0) {
          libraryStatus.textContent =
            "暂时没有找到音频文件，请检查存储桶中的文件。";
          return;
        }

        libraryStatus.textContent =
          `共 ${supabaseSongs.length} 首歌曲 · 按日期归档`;

        // 列表按日期从新到旧排列；无日期歌曲排在最后。
        // supabaseSongs 本身仍保留原来的标题排序，避免改变上一首/下一首逻辑。
        displaySongs = [...supabaseSongs].sort((a, b) => {
          if (a.date && b.date) {
            return b.date.localeCompare(a.date) ||
              a.title.localeCompare(b.title, "zh-CN", {
                numeric: true,
                sensitivity: "base"
              });
          }
          if (a.date) return -1;
          if (b.date) return 1;
          return a.title.localeCompare(b.title, "zh-CN", {
            numeric: true,
            sensitivity: "base"
          });
        });

        currentPage = 1;
        renderSongListPage();
      } catch (error) {
        console.error("音乐库加载失败：", error);
        libraryStatus.textContent =
          "歌曲列表加载失败，请检查项目配置和网络连接。";
      }
    }

    // 播放 Supabase 中的歌曲
     function playSupabaseSong(song, options = {}) {
      // 随机模式下，手动选择歌曲就以它为新的起点。
      // 从随机队列内部切歌时，不重置队列。
      if (
        currentPlayMode === "shuffle" &&
        !options.fromShuffleQueue
      ) {
        recordManualShuffleSelection(song);
      }
      activeSongName = song.name;
      currentSongIndex = displaySongs.findIndex(
        item => item.name === song.name
      );

      if (currentFileUrl) {
        URL.revokeObjectURL(currentFileUrl);
        currentFileUrl = null;
      }

      audio.src = song.url;
      audio.load();

      songName.textContent = song.title;
      artist.textContent = "小心思";
      fileName.textContent = "正在播放在线音乐：" + song.title;

      cover.textContent = "♫";
      cover.querySelector("img")?.remove();

      progress.value = 0;
      currentTime.textContent = "0:00";
      duration.textContent = "读取时长中…";

      document.querySelectorAll(".song-item").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.songName === song.name
        );
      });

      audio.play().catch(error => {
        console.error("播放失败：", error);
        fileName.textContent =
          "播放失败，请检查音频 URL 和存储桶权限。";
      });
    }

// ===== 播放上一首 =====
function playPreviousSong() {
  if (supabaseSongs.length === 0) return;

  // 随机模式：回到已经听过的上一首
  if (currentPlayMode === "shuffle") {
    if (shuffleHistoryPosition > 0) {
      shuffleHistoryPosition--;

      const previousName =
        shuffleHistory[shuffleHistoryPosition];

      const previousSong = supabaseSongs.find(
        song => song.name === previousName
      );

      if (previousSong) {
        playSupabaseSong(previousSong, {
          fromShuffleQueue: true
        });
      }
    }

    return;
  }

  // 顺序模式和单曲循环模式沿用原逻辑
  const previousIndex =
    (currentSongIndex - 1 + displaySongs.length)
    % displaySongs.length;

  playSupabaseSong(displaySongs[previousIndex]);
}


// ===== 播放下一首 =====
function playNextSong() {
  if (supabaseSongs.length === 0) return;

  if (currentPlayMode === "shuffle") {

    // 如果刚刚按过上一首，先回到历史中下一首
    if (
      shuffleHistoryPosition <
      shuffleHistory.length - 1
    ) {
      shuffleHistoryPosition++;

      const nextHistoryName =
        shuffleHistory[shuffleHistoryPosition];

      const nextHistorySong = supabaseSongs.find(
        song => song.name === nextHistoryName
      );

      if (nextHistorySong) {
        playSupabaseSong(nextHistorySong, {
          fromShuffleQueue: true
        });
      }

      return;
    }

    // 本轮队列用完后，重新洗牌
    if (shuffleUpcoming.length === 0) {
      refillShuffleUpcoming(activeSongName);
    }

    // 只有一首歌时，无法做到不重复
    if (shuffleUpcoming.length === 0) {
      playSupabaseSong(supabaseSongs[0], {
        fromShuffleQueue: true
      });
      return;
    }

    // 取出随机队列中的下一首
    const nextSong = shuffleUpcoming.shift();

    // 丢弃历史中当前位置之后的分支，再记录新播放的歌
    shuffleHistory = shuffleHistory.slice(
      0,
      shuffleHistoryPosition + 1
    );

    shuffleHistory.push(nextSong.name);
    shuffleHistoryPosition = shuffleHistory.length - 1;

    playSupabaseSong(nextSong, {
      fromShuffleQueue: true
    });

    return;
  }

  // 顺序模式：保持原来的顺序播放
  const nextIndex =
    (currentSongIndex + 1) % displaySongs.length;

  playSupabaseSong(displaySongs[nextIndex]);
}


// ===== 当前歌曲播放结束 =====
audio.addEventListener("ended", function () {

  // 单曲循环：重新播放当前歌曲
  if (currentPlayMode === "single") {
    audio.currentTime = 0;

    audio.play().catch(function (error) {
      console.error("播放失败：", error);
    });

    return;
  }

  // 随机模式和顺序模式都使用对应的下一首逻辑
  playNextSong();
});


    // 页面打开时自动加载音乐库
    loadSupabaseSongs();

    audio.addEventListener("error", function () {
      if (audio.src) {
        fileName.textContent =
          "文件无法播放，请尝试选择浏览器支持的音频文件。";
      }
    });
